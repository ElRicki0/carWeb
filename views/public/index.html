<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="../../resources/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../resources/svg/bootstrap-icons.min.css">
    <!--? general public styles css -->
    <link rel="stylesheet" href="../../resources/css/personal.css">

</head>

<body>
    <h1 id="mainTitle"></h1>
    <main>
        <!-- picture carrusel -->
        <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                    aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
                    aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="3"
                    aria-label="Slide4"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="./../../resources/img/public/carrucel/CarCarruzel(1).jpg" class="d-block w-100" alt="...">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Accessibility</h5>
                        <p>The best car for a better man</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="./../../resources/img/public/carrucel/CarCarruzel(2).jpg" class="d-block w-100" alt="...">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Affordable</h5>
                        <p>Anyone can get they own car</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="./../../resources/img/public/carrucel/CarCarruzel(3).jpg" class="d-block w-100" alt="...">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>friendly</h5>
                        <p>we have any kind of accessibility</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="./../../resources/img/public/carrucel/CarCarruzel(4).jpg" class="d-block w-100" alt="...">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>reliable</h5>
                        <p>quality for life in the engine</p>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <!-- IMPORTACIÓN DE ARCHIVOS JAVASCRIPT -->
        <!-- Llamada al framework y librería de mensajes -->
        <script src="../../resources/js/bootstrap/bootstrap.min.js"></script>
        <script src="../../resources/js/sweetAlert2/sweetalert2@11.js"></script>
        <!-- Llamada al controlador general de la aplicación -->
        <script type="text/javascript" src="../../controllers/utils/components.js"></script>
        <!-- Llamada al controlador del sitio privado -->
        <script type="text/javascript" src="../../controllers/utils/public.js"></script>
        <!-- ? Llamada al controlador de la página web -->
        <script type="text/javascript" src="../../controllers/public/index.js"></script>

    </main>
</body>

</html>
