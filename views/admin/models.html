<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="../../resources/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../resources/svg/bootstrap-icons.min.css">
</head>

<body>
    <main>
        <h1 id="mainTitle"></h1>
        <div class="row">
            <form class="col-sm-12 col-md-6" id="searchForm">
                <div class="row">
                    <div class="col-6">
                        <input type="search" class="form-control" name="search" placeholder="search..." required>
                    </div>
                    <div class="col-6">
                        <div class="btn-group">
                            <button type="submit" class="btn btn-success">
                                <h5><i class="bi bi-search"></i></h5>
                            </button>
                            <button type="reset" class="btn btn-secondary" onclick="changeTableType(null)">
                                <h5> <i class="bi bi-arrow-counterclockwise"></i></h5>
                            </button>
                            <!-- Botón para abrir una caja de diálogo al momento de crear un nuevo registro -->
                            <button type="button" class="btn btn-warning" onclick="openCreate()">
                                <h5><i class="bi bi-plus-square-fill"></i></h5>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-4">
            <p id="rowsFound" class="fw-bold mt-3 mb-0">status</p>

            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="changeTableType(1)">
                    <h4 class="p-2">
                        <i class="bi bi-card-list"></i>
                    </h4>
                </button>
                <button type="button" class="btn btn-secondary" onclick="changeTableType(2)">
                    <h4 class="p-2">
                        <i class="bi bi-grid"></i>
                    </h4>
                </button>
            </div>
        </div>
        <div class="my-5" id="contentModels">

        </div>

        <!-- Modal Body -->
        <!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
        <div class="modal fade" id="saveModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
            role="dialog" aria-labelledby="modalTitle" aria-hidden="true">
            <div class="modal-dialog  modal-dialog-centered modal-md" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">
                            Title Example
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="saveForm">
                        <input type="number" name="idModel" id="idModel" class="d-none">
                        <div class="modal-body">
                            <div class="row">
                                <div class="col-12 ">
                                    <div class="mb-3">
                                        <label for="nameModel" class="form-label">Model Name</label>
                                        <input type="text" class="form-control" name="nameModel" id="nameModel"
                                            placeholder="Model name here..." />
                                    </div>
                                </div>
                                <div class="col-12 ">
                                    <div class="mb-3">
                                        <label for="brandModel" class="form-label">Brand select </label>
                                        <select class="form-select form-select-lg" name="brandModel" id="brandModel">
                                            <option selected>Select one option</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-12 col-lg-6">
                                    <div class="mb-3">
                                        <label for="categoryCar" class="form-label">Car Category</label>
                                        <select class="form-select " name="categoryCar" id="categoryCar">
                                            <option selected>First select a category</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Close
                            </button>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>


        <!-- IMPORTACIÓN DE ARCHIVOS JAVASCRIPT -->
        <!-- Llamada al framework y librería de mensajes -->
        <script src="../../resources/js/bootstrap/bootstrap.min.js"></script>
        <script src="../../resources/js/sweetAlert2/sweetalert2@11.js"></script>
        <!-- Llamada al controlador general de la aplicación -->
        <script type="text/javascript" src="../../controllers/utils/components.js"></script>
        <!-- Llamada al controlador del sitio privado -->
        <script type="text/javascript" src="../../controllers/utils/admin.js"></script>
        <!-- ? Llamada al controlador de la página web -->
        <script src="../../controllers/admin/models.js"></script>
    </main>
</body>

</html>
