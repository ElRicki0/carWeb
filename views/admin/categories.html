<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="../../resources/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../resources/svg/bootstrap-icons.min.css">
</head>

<body>
    <main>
        <h1 id="mainTitle"></h1>
        <!-- Formulario de búsqueda -->
        <div class="row">
            <form class="col-sm-12 col-md-6" id="searchForm">
                <div class="row">
                    <div class="col-6">
                        <input type="search" class="form-control" name="search" placeholder="search..." required>
                    </div>
                    <div class="col-6">
                        <div class="btn-group">
                            <button type="submit" class="btn btn-success">
                                <h5><i class="bi bi-search"></i></h5>
                            </button>
                            <button type="reset" class="btn btn-secondary" onclick="changeTableType(null)">
                                <h5> <i class="bi bi-arrow-counterclockwise"></i></h5>
                            </button>
                            <!-- Botón para abrir una caja de diálogo al momento de crear un nuevo registro -->
                            <button type="button" class="btn btn-warning" onclick="openCreate()">
                                <h5><i class="bi bi-plus-square-fill"></i></h5>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-4">
            <p id="rowsFound" class="fw-bold mt-3 mb-0">status</p>

            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="changeTableType(1)">
                    <h4 class="p-2">
                        <i class="bi bi-card-list"></i>
                    </h4>
                </button>
                <button type="button" class="btn btn-secondary" onclick="changeTableType(2)">
                    <h4 class="p-2">
                        <i class="bi bi-grid"></i>
                    </h4>
                </button>
            </div>
        </div>

        <div class="my-5" id="contentCategories">

            <!-- <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered table-light align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Category name</th>
                            <th>Category Description</th>
                            <th>Category Type</th>
                            <th>Category status</th>
                            <th>Picture</th>
                        </tr>
                    </thead>
                    <tbody class="table-group-divider" id="tableBody">

                    </tbody>
                </table>
            </div> -->
        </div>

        <!-- Modal Body -->
        <!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
        <div class="modal fade" id="saveModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
            role="dialog" aria-hidden="true">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">
                            Modal title
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="saveForm">
                        <!-- Campo oculto para asignar el id del registro al momento de modificar -->
                        <input type="number" class="d-none" id="idCategory" name="idCategory">
                        <div class="modal-body">
                            <div class="row">
                                <div class="col-12 text-center mb-3"> <!-- Asegura el centrado de la imagen -->
                                    <label for="inputPictureCategory" style="cursor: pointer;">
                                        <img id="pictureCategory"
                                            class="rounded mx-auto d-block img-fluid mt-3 border border-3 border-secondary-subtle rounded-circle imagen_R"
                                            src="./../../resources/img/error/404Picture.png" id="imagenVisualAdmin"
                                            alt="Picture error" width="200px" height="200px">
                                    </label>
                                    <input id="inputPictureCategory" type="file" name="inputPictureCategory"
                                        class="form-control d-none" accept=".png, .jpg">
                                </div>
                                <div class="col-12 col-lg-6">
                                    <div class="mb-3">
                                        <label for="nameCategory" class="form-label">Category Name</label>
                                        <input type="text" class="form-control" name="nameCategory" id="nameCategory"
                                            aria-describedby="helpId" placeholder="Category name here..." />
                                    </div>
                                    <div class="mb-3">
                                        <label for="descriptionCategory" class="form-label">Category Description</label>
                                        <textarea class="form-control" name="descriptionCategory"
                                            id="descriptionCategory" rows="2"
                                            placeholder="Category description here..."></textarea>
                                    </div>

                                </div>
                                <div class="col-12 col-lg-6">
                                    <div class="mb-3">
                                        <label for="typeCategory" class="form-label">Category usage type</label>
                                        <input type="text" class="form-control" name="typeCategory" id="typeCategory"
                                            aria-describedby="helpId" placeholder="Usage type here..." />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Category status</label>

                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="statusCategory"
                                                id="statusCategory" checked value="1" />
                                            <label class="form-check-label" for="statusCategory">
                                                Active status
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="statusCategory"
                                                id="statusCategory2" value="0" />
                                            <label class="form-check-label" for="statusCategory2"> Inactive status
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Close
                            </button>
                            <button type="submit" class="btn btn-primary" id="buttonModal">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- IMPORTACIÓN DE ARCHIVOS JAVASCRIPT -->
        <!-- Llamada al framework y librería de mensajes -->
        <script src="../../resources/js/bootstrap/bootstrap.min.js"></script>
        <script src="../../resources/js/sweetAlert2/sweetalert2@11.js"></script>
        <!-- Llamada al controlador general de la aplicación -->
        <script type="text/javascript" src="../../controllers/utils/components.js"></script>
        <!-- Llamada al controlador del sitio privado -->
        <script type="text/javascript" src="../../controllers/utils/admin.js"></script>
        <!-- ? Llamada al controlador de la página web -->
        <script src="../../controllers/admin/categories.js"></script>
    </main>
</body>

</html>
