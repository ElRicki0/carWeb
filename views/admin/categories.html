<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="../../resources/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../resources/svg/bootstrap-icons.min.css">
</head>

<body>
    <main>
        <h1 id="mainTitle"></h1>
        <!-- Formulario de búsqueda -->
        <div class="row">
            <form class="col-sm-12 col-md-6" id="searchForm">
                <div class="row">
                    <div class="col-6">
                        <input type="search" class="form-control" name="search" placeholder="Buscar" required>
                    </div>
                    <div class="col-6">
                        <div class="btn-group">
                            <button type="submit" class="btn btn-success">
                                <h5><i class="bi bi-search"></i></h5>
                            </button>
                            <button type="reset" class="btn btn-secondary" onclick="fillTable()">
                                <h5> <i class="bi bi-arrow-counterclockwise"></i></h5>
                            </button>
                            <!-- Botón para abrir una caja de diálogo al momento de crear un nuevo registro -->
                            <button type="button" class="btn btn-warning" onclick="openCreate()">
                                <h5><i class="bi bi-plus-square-fill"></i></h5>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <p id="rowsFound" class=" fw-bold mt-3">status</p>

        <div class="my-5" id="contentCategories">

            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered table-light align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Column 1</th>
                            <th>Column 2</th>
                            <th>Column 3</th>
                        </tr>
                    </thead>
                    <tbody class="table-group-divider" id="tableBody">
                        <tr class="table-light">
                            <td scope="row">Item</td>
                            <td>Item</td>
                            <td>Item</td>
                        </tr>
                        <tr class="table-light">
                            <td scope="row">Item</td>
                            <td>Item</td>
                            <td>Item</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
        <!-- IMPORTACIÓN DE ARCHIVOS JAVASCRIPT -->
        <!-- Llamada al framework y librería de mensajes -->
        <script src="../../resources/js/bootstrap/bootstrap.min.js"></script>
        <script src="../../resources/js/sweetAlert2/sweetalert2@11.js"></script>
        <!-- Llamada al controlador general de la aplicación -->
        <script type="text/javascript" src="../../controllers/utils/components.js"></script>
        <!-- Llamada al controlador del sitio privado -->
        <script type="text/javascript" src="../../controllers/utils/admin.js"></script>
        <!-- ? Llamada al controlador de la página web -->
        <script src="../../controllers/admin/categories.js"></script>
    </main>
</body>

</html>
