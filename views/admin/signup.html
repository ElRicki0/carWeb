<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="../../resources/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../resources/svg/bootstrap-icons.min.css">
</head>

<body>
    <main class="mt-5">
        <div class="d-flex justify-content-center align-items-center vh-100">
            <div class="card w-50 ">
                <div class="card-body">
                    <h1 class="card-title text-center">Sign up</h1>
                    <p class="text-center">It's quick and easy</p>
                    <div class="mt-3">
                        <div class="mb-3">
                            <label for="nameAdmin" class="form-label">Name</label>
                            <input type="text" class="form-control" name="nameAdmin" id="nameAdmin"
                                placeholder="Here your complete name..." />
                        </div>

                        <div class="mb-3">
                            <label for="emailAdmin" class="form-label">Email</label>
                            <input type="email" class="form-control" name="emailAdmin" id="emailAdmin"
                                placeholder="Here your email..." />
                        </div>

                        <div class="mb-3">
                            <label for="phoneAdmin" class="form-label">Phone number</label>
                            <input type="number" class="form-control" name="phoneAdmin" id="phoneAdmin"
                                placeholder="Here your phone number..." />
                        </div>
                        <div class="mb-3">
                            <label for="usernameAdmin" class="form-label">Username</label>
                            <input type="text" class="form-control" name="usernameAdmin" id="usernameAdmin"
                                placeholder="Here your user name..." />
                        </div>

                        <div class="mb-3">
                            <label for="passwordAdmin" class="form-label">Password</label>
                            <div class="input-group mb-3">
                                <input type="password" class="form-control" placeholder="Here your password..."
                                    id="passwordAdmin" name="passwordAdmin">
                                <button type="button" class="btn btn-secondary ">
                                    <i class="bi bi-eye-fill"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password2Admin" class="form-label">Repeat password</label>
                            <div class="input-group mb-3">
                                <input type="password" class="form-control" placeholder="Repeat here your password..."
                                    aria-label="Password" id="password2Admin" name="password2Admin">
                                <button type="button" class="btn btn-secondary ">
                                    <i class="bi bi-eye-fill"></i>
                                </button>
                            </div>
                        </div>
                        <hr class="border-5 my-5">
                        <div class="text-center">
                            <button type="button" class="btn btn-success btn-lg w-50">
                                Sign In
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- IMPORTACIÓN DE ARCHIVOS JAVASCRIPT -->
        <!-- Llamada al framework y librería de mensajes -->
        <script src="../../resources/js/bootstrap/bootstrap.min.js"></script>
        <script src="../../resources/js/sweetAlert2/sweetalert2@11.js"></script>
        <!-- Llamada al controlador general de la aplicación -->
        <script type="text/javascript" src="../../controllers/utils/components.js"></script>
        <!-- Llamada al controlador del sitio privado -->
        <script type="text/javascript" src="../../controllers/utils/admin.js"></script>
        <!-- ? Llamada al controlador de la página web -->
        <script src="../../controllers/admin/signup.js"></script>
    </main>
</body>

</html>
