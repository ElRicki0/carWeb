<!DOCTYPE html>
<html lang="en  ">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <link rel="stylesheet" href="../../resources/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../resources/svg/bootstrap-icons.min.css">
</head>

<body class="">
    <main class="text-center">
        <form id="loginForm">
            <div class="d-flex justify-content-center align-items-center mt-5">
                <div class="car-body p-5 rounded shadow w-auto">
                    <h1 id="mainTitle" class="mb-5">Login</h1>
                    <div class="mb-4">
                        <h5 for="userAdmin" class="form-label">Username</h5>
                        <div class="input-group">
                            <span class="input-group-text" id="basic-addon1"><i
                                    class="bi bi-person-circle fs-4"></i></span>
                            <input type="text" class="form-control form-control-lg" name="usernameAdmin" id="usernameAdmin"
                                placeholder="Type your username..." />
                        </div>
                    </div>
                    <div class="mb-4">
                        <h5 for="pass" class="form-label">Password</h5>
                        <div class="input-group">
                            <span class="input-group-text" id="basic-addon1"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control form-control-lg" name="passwordAdmin" id="passwordAdmin"
                                placeholder="Type your password..." />
                            <button class="btn btn-outline-secondary" type="button">
                                <i class="bi bi-eye-fill"></i>
                            </button>
                        </div>
                    </div>

                    <hr class="border-5">
                    <div class="p-3 row">
                        <div class="col-6">
                            <p href="#" class="text-danger text-decoration-none">wrong password</p>
                        </div>
                        <div class="col-6">
                            <a href="#" class=" text-decoration-none">forgot password?</a>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 fs-3" type="submit">Login</button>
                </div>
            </div>
        </form>
    </main>

    <script src="../../resources/js/bootstrap/bootstrap.min.js"></script>
    <script src="../../resources/js/sweetAlert2/sweetalert2@11.js"></script>
    <script src="../../controllers/utils/components.js"></script>
    <script src="../../controllers/utils/admin.js"></script>
    <!-- page controller js -->
    <script src="../../controllers/admin/index.js"></script>
</body>

</html>
